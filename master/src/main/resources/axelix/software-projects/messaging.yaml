  - id: rabbitmq-java-clients
    name: RabbitMQ Java Clients
    status: ACTIVE
    summary: >-
      The Java clients for RabbitMQ, actively developed by the RabbitMQ team: the AMQP 0-9-1 client
      and the Streams client.
    coordinates:
      - com.rabbitmq:amqp-client
      - com.rabbitmq:stream-client
    reference:
      label: RabbitMQ client libraries
      url: https://www.rabbitmq.com/client-libraries

