ecosystem: SECURITY
projects:
  - id: spring-security-oauth
    name: Spring Security OAuth
    status: SUNSET
    summary: >-
      Reached end of life in 2022 and moved to the Spring attic. Its OAuth 2.0 client and resource
      server support was rebuilt inside Spring Security itself, and the authorization server became
      the separate Spring Authorization Server project.
    coordinates:
      - org.springframework.security.oauth:spring-security-oauth2
      - org.springframework.security.oauth.boot:spring-security-oauth2-autoconfigure
    succession:
      kind: SUPERSEDED_BY
      value: org.springframework.security:spring-security-oauth2-client
    reference:
      label: Spring Security OAuth in the attic
      url: https://github.com/spring-attic/spring-security-oauth

  - id: unboundid-ldapsdk
    name: UnboundID LDAP SDK
    status: ACTIVE
    summary: >-
      Actively developed by Ping Identity.
    coordinates:
      - com.unboundid:unboundid-ldapsdk
    reference:
      label: UnboundID LDAP SDK
      url: https://github.com/pingidentity/ldapsdk
  - id: jjwt
    name: JJWT
    status: ACTIVE
    summary: >-
      Actively developed. A widely used library for creating and verifying JSON Web Tokens on the
      JVM.
    coordinates:
      - io.jsonwebtoken:jjwt-api
      - io.jsonwebtoken:jjwt-impl
      - io.jsonwebtoken:jjwt-jackson
      - io.jsonwebtoken:jjwt-gson
    reference:
      label: JJWT
      url: https://github.com/jwtk/jjwt

  - id: nimbus-jose-jwt
    name: Nimbus JOSE + JWT
    status: ACTIVE
    summary: >-
      Actively developed by Connect2id. The JOSE/JWT library Spring Security uses for OAuth 2.0
      resource servers, together with the companion OAuth 2.0 / OpenID Connect SDK.
    coordinates:
      - com.nimbusds:nimbus-jose-jwt
      - com.nimbusds:oauth2-oidc-sdk
    reference:
      label: Nimbus JOSE + JWT
      url: https://connect2id.com/products/nimbus-jose-jwt


  - id: jasypt
    name: Jasypt
    status: SUNSET
    summary: >-
      The author states that the library is no longer maintained, and the repository is archived.
      The last release, 1.9.3, dates to May 2019. The separate jasypt-spring-boot
      integration is still released, but it builds on this unmaintained core.
    coordinates:
      - org.jasypt:jasypt
      - org.jasypt:jasypt-spring31
    succession:
      kind: NO_DIRECT_REPLACEMENT
      value: No drop-in replacement exists; secrets are usually moved to an external store such as Spring Cloud Vault, or encrypted with the JDK cryptography APIs directly
    reference:
      label: Archived Jasypt repository
      url: https://github.com/jasypt/jasypt

  - id: jbcrypt
    name: jBCrypt
    status: DORMANT
    summary: >-
      No release since 0.4, published to Maven Central in February 2017, and no commits since
      February 2015, although the project was never formally discontinued.
    coordinates:
      - org.mindrot:jbcrypt
    succession:
      kind: NO_DIRECT_REPLACEMENT
      value: Spring Security's BCryptPasswordEncoder (org.springframework.security:spring-security-crypto) is the common actively maintained BCrypt implementation
    reference:
      label: jBCrypt on GitHub
      url: https://github.com/jeremyh/jBCrypt

  - id: spring-cloud-security
    name: Spring Cloud Security
    status: SUNSET
    summary: >-
      No longer maintained and archived; Spring lists it as end of life. The last release is
      2.2.5.RELEASE from April 2021.
    coordinates:
      - org.springframework.cloud:spring-cloud-security
      - org.springframework.cloud:spring-cloud-starter-security
      - org.springframework.cloud:spring-cloud-starter-oauth2
    succession:
      kind: NO_DIRECT_REPLACEMENT
      value: Spring Security's built-in OAuth 2.0 client and resource server support, with Spring Cloud Gateway's TokenRelay for token propagation
    reference:
      label: Archived Spring Cloud Security repository
      url: https://github.com/spring-cloud/spring-cloud-security

  - id: spring-security-saml-extension
    name: Spring Security SAML Extension
    status: SUNSET
    summary: >-
      Reached end of life on 6 October 2021 and the repository is archived. SAML 2.0 support now
      lives in Spring Security itself.
    coordinates:
      - org.springframework.security.extensions:spring-security-saml2-core
    succession:
      kind: SUPERSEDED_BY
      value: org.springframework.security:spring-security-saml2-service-provider
    reference:
      label: Spring Security SAML extension end-of-life notice
      url: https://spring.io/blog/2020/09/22/spring-security-saml-extensions-1-x-eol-on-october-6-2021
