name: axelix
version: 1.0.0
description: APM project for axelix
dependencies:
  apm:
  # Custom
  - ./.agents/skills/backlog-refiner
  - ./.agents/skills/docs-writer
  - ./.agents/skills/external-contributor-issues
  - ./.agents/skills/housekeeper
  - ./.agents/skills/security-vulnerabilities-patcher
  - ./.agents/skills/test-reviewer
  - ./.agents/skills/starter-domain-reviewer
  # External
  - anthropics/skills/skills/skill-creator
  - wondelai/skills/refactoring-ui
  mcp:
  - name: github
    registry: false
    transport: stdio
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-github'
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PAT}"
  - name: axelix-local
    registry: false
    transport: http
    url: http://localhost:2935/api/mcp
    headers:
      Authorization: "Basic YWRtaW46YWRtaW4="
includes: auto
scripts: {}
